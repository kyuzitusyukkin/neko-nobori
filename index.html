<style>
*{-webkit-tap-highlight-color:transparent}
canvas,button,[role=button]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0}
button{font-family:inherit}
@keyframes cc-pop{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
.cc-help > *{flex-shrink:0}
@keyframes kari-fly{0%{transform:translate(0,10px) scale(0.6);opacity:0}25%{transform:translate(0,0) scale(1.1);opacity:1}55%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(143px,-406px) scale(0.45);opacity:0.2}}
@keyframes cc-tap{0%,100%{transform:scale(1)}50%{transform:scale(1.08,0.94)}}
@keyframes kari-bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ===== slime skin ===== */
@keyframes pz-drop{0%{transform:translateY(-26px);opacity:0}60%{transform:translateY(0) scale(1,1);opacity:1}78%{transform:translateY(0) scale(1.2,.78)}90%{transform:scale(.94,1.06)}100%{transform:none;opacity:1}}
@keyframes pz-pop{0%{transform:scale(.4)}55%{transform:scale(1.38,1.08)}75%{transform:scale(1.02,1.22)}100%{transform:scale(1.1)}}
@keyframes pz-poof{0%{transform:scale(1);opacity:1}35%{transform:scale(1.4,1.15);opacity:1}100%{transform:scale(.1,.3);opacity:0;filter:blur(2px)}}
@keyframes slime-wob{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,.94)}65%{transform:scale(.97,1.03)}}
@keyframes slime-bw{0%,100%{border-radius:50%}33%{border-radius:54% 46% 50% 50%/46% 54% 46% 54%}66%{border-radius:46% 54% 52% 48%/54% 46% 54% 46%}}
.pz-cell svg{animation:slime-wob 2.4s ease-in-out infinite;transform-origin:50% 80%}
button:not([style*="transform"]),a[href]:not([style*="transform"]){transition:transform .45s cubic-bezier(.25,1.9,.5,1)}
button:not([style*="transform"]):active,a[href]:not([style*="transform"]):active{transform:scale(1.1,.86);transition:transform .07s}
button[style*="border-radius"]:not([style*="transparent"]):not([style*="background: none"]),a[href][style*="border-radius"]:not([style*="transparent"]){box-shadow:inset 0 2px 4px rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.18)}
.slime-bub{position:absolute;border-radius:50%;pointer-events:none;animation:slime-bw 2s ease-in-out infinite;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.9) 0 9%,rgba(255,255,255,0) 11%),radial-gradient(circle at 50% 55%,rgba(60,45,110,.15) 0%,rgba(70,55,130,.45) 68%,rgba(220,200,255,.55) 100%);border:1px solid rgba(255,205,240,.75);box-shadow:inset -3px -3px 6px rgba(255,170,230,.45),inset 3px 2px 5px rgba(160,255,240,.4),0 0 8px rgba(200,180,255,.25)}
</style>

<style>
html,body{margin:0;height:100%;background:#231C45;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}

<body>
<div id="stage"><div id="dc-root"></div></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(circle at 20% 28%, rgba(255,150,220,0.16), transparent 45%), radial-gradient(circle at 85% 62%, rgba(120,170,255,0.16), transparent 50%), linear-gradient(180deg, #0b0b26 0%, #1d1640 50%, #2b1d4f 100%); font-family: 'Zen Maru Gothic', sans-serif; color: {{t.ink}}; box-sizing: border-box">

        <div role="status" style="width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 20px; background: rgba(30,22,64,0.86); border: 1px solid rgba(255,210,245,0.38); color: #F3EEFF; font-size: 15px; font-weight: 700; line-height: 1.6; text-align: center">{{tutMsg}}</div>
        <sc-if value="{{tutHasTap}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; font-weight: 700; color: #1a1438; background: #A6FFF0; border-radius: 16px; padding: 6px 16px; animation: cc-tap 0.9s ease-in-out infinite">{{tutTap}}</span></sc-if>

      <button onClick="{{skipTut}}" style="position: absolute; right: 16px; bottom: 74px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.3); background: rgba(30,22,64,0.7); color: #F3EEFF; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit">スキップ</button>
    </sc-if>
    <!-- 下の情報（2行：見出し＋数字） -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: rgba(40,28,80,0.55); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; pointer-events: none; color: #FFFFFF">

  </div>


  <!-- 上のボタン（ゲームの上にのせる。タイトルは出さない） -->
  <div style="position: absolute; left: 12px; right: 12px; top: 52px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1"></div>
    <button aria-label="あそびかた" onClick="{{openHelp}}" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: rgba(255,255,255,0.16); color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0">?</button>
    <button aria-label="{{soundLabel}}" aria-pressed="{{soundOn}}" onClick="{{toggleSound}}" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: rgba(255,255,255,0.16); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="#FFFFFF"></path><path d="{{soundPath}}"></path></svg></button>
  </div>
  <!-- あそびかた -->
  <sc-if value="{{helpOn}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; z-index: 30; background: rgba(10,8,18,0.72); display: flex; align-items: center; justify-content: center; padding: 0 18px 92px 18px">
    <div style="position: relative; width: 100%">
      <button aria-label="とじる" onClick="{{closeHelp}}" style="position: absolute; left: -10px; top: -10px; z-index: 2; width: 40px; height: 40px; border-radius: 20px; border: 1px solid {{t.border}}; background: {{t.modal}}; box-shadow: 0 2px 8px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div role="dialog" aria-label="あそびかた" class="cc-help" style="width: 100%; max-height: 640px; overflow-y: auto; background: {{t.modal}}; border: 1px solid {{t.border}}; border-radius: 22px; padding: 20px 18px 16px 18px; display: flex; flex-direction: column; gap: 14px; animation: cc-pop 0.2s ease-out; box-sizing: border-box">
      <div style="font-size: 17px; font-weight: 700; padding-left: 30px">あそびかた</div>
      <ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.6">
        <li>猫はキャットタワーを自動でのぼっていきます</li>
        <li>タップすると反対がわのかべにジャンプ</li>
        <li>かべから出ているトゲやしましまブロックにぶつかったら、おしまい</li>
        <li>おさかなを食べると点が増えるけど、猫がどんどん太って、ジャンプがおそく・体が大きくなります</li>
        <li>ねこじゃらしにさわると、少しやせます</li>

        <li>おさかなやねこじゃらしを取りのがすと Miss。Missが3回でゲームオーバー（1回目は青、2回目は黄色、3回目は赤）</li>
      </ul>
      <button onClick="{{tutAgain}}" style="align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit">{{tutAgainLabel}}</button>
      <div style="font-size: 14px; font-weight: 700; margin-top: 4px">体型</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{fats}}" as="f" hint-placeholder-count="10">
          <span style="font-size: 12.5px; padding: 4px 10px; border-radius: 12px; background: {{t.surface}}">{{f.label}}</span>
        </sc-for>
      </div>
    </div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; bottom: {{ovBottom}}; z-index: 10; background: rgba(20,16,28,0.5); display: flex; align-items: center; justify-content: center; padding: 0 28px">
    <div role="dialog" aria-label="結果" style="position: relative; width: 100%; background: {{t.bg}}; border-radius: 22px; padding: 22px 20px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: cc-pop 0.25s ease-out">
      <div style="font-size: 15px; font-weight: 700; color: {{t.sub}}">{{overMsg}}</div>
      <canvas ref="{{bigRef}}" width="200" height="180" aria-label="{{topFatName}}" style="width: 100px; height: 90px"></canvas>
      <div style="font-size: 13px; color: {{t.sub}}">のぼった高さ <b style="color: {{t.ink}}">{{height}}m</b>　・　おさかな <b style="color: {{t.ink}}">{{fish}}</b>匹</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px; border-radius: 14px; background: {{t.surface}}">
        <div style="font-size: 13px; color: {{t.sub}}">さいだいの体型 <b style="font-size: 16px; color: {{t.ink}}">{{topFatName}}</b>（{{topFatStep}}）</div>
        <div role="img" aria-label="さいだいの体型 {{topFatStep}}" style="display: flex; gap: 3px">
          <sc-for list="{{topFatSegs}}" as="g" hint-placeholder-count="10"><span style="width: 16px; height: 7px; border-radius: 4px; background: {{g.bg}}"></span></sc-for>
        </div>
      </div>
      <div style="font-size: 13px; color: {{t.sub}}">さいだいコンボ <b style="color: {{t.ink}}">{{maxCombo}}</b></div>
      <div style="font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums">{{score}}</div>
      <sc-if value="{{newBest}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; font-weight: 700; color: #D9A23F">ベスト更新！</div></sc-if>
      <div style="width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); justify-items: center; margin-top: 4px">
        <button aria-label="Instagramで共有" onClick="{{shareIg}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; cursor: pointer; padding: 0">
          <span style="width: 46px; height: 46px; border-radius: 15px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17" cy="7" r="0.9" fill="{{t.ink}}"></circle></svg></span>
          <span style="font-size: 11px; font-weight: 700; color: {{t.ink}}">Instagram</span>
        </button>
        <button aria-label="Twitterで共有" onClick="{{shareTw}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; cursor: pointer; padding: 0">
          <span style="width: 46px; height: 46px; border-radius: 15px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9.5h8M8 12.5h5"></path></svg></span>
          <span style="font-size: 11px; font-weight: 700; color: {{t.ink}}">Twitter</span>
        </button>
        <button aria-label="共有" onClick="{{shareAny}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; cursor: pointer; padding: 0">
          <span style="width: 46px; height: 46px; border-radius: 15px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"></path><path d="M5 12v7.5h14V12"></path></svg></span>
          <span style="font-size: 11px; font-weight: 700; color: {{t.ink}}">共有</span>
        </button>
        <button aria-label="画像を保存" onClick="{{shareDl}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; cursor: pointer; padding: 0">
          <span style="width: 46px; height: 46px; border-radius: 15px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5V15M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 19.5h14"></path></svg></span>
          <span style="font-size: 11px; font-weight: 700; color: {{t.ink}}">保存</span>
        </button>
      </div>
      <sc-if value="{{resSaved}}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); white-space: nowrap; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(30,24,48,0.82); border-radius: 14px; padding: 8px 14px">保存しました</div></sc-if>
      <button onClick="{{restart}}" style="margin-top: 6px; width: 100%; height: 48px; border-radius: 24px; border: none; background: {{t.accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">もう一回</button>
    </div>
  </div>
  </sc-if>

</div>
</template>
<script type="text/plain" id="dc-logic">
// ねこのぼり：Chromeの恐竜ゲームを縦にしたもの。猫はキャットタワーを自動でのぼり、タップで左右のかべを行き来して障害物をよける
// おさかなを食べると点が入るかわりに太っていく（体が大きく・ジャンプがおそくなる）。ねこじゃらしで少しやせる
const W = 390, H = 752, SCALE = 2, WALL = 22, CAT_Y = 550;   // 画面いっぱい（下のメニューの上まで）。下62pxは情報の帯
const FATS = ['ほっそり', 'ふつう', 'まるまる', 'ふくふく', 'もちもち', 'ビッグ', 'スーパービッグ', 'ハイパービッグ', 'ウルトラビッグ', 'うちゅうビッグ'];
const MAXLV = FATS.length - 1;
// コンボ：おさかな・ねこじゃらしを取りのがさず続けて取ると、2コンボ目から1コンボごとに+5点（最大+50）
const MISS_MAX = 3;   // 取りのがし（Miss）が累計この回数でゲームオーバー
const MISS_COL = ['#6FB8FF', '#FFD84D', '#FF5A6E'];   // 1回目 青 → 2回目 黄色 → 3回目 赤
const tutDone = () => { try { return window.localStorage.getItem('catClimbTut') === '1'; } catch (e) { return true; } };
const comboBonus = (n) => (n >= 2 ? Math.min(50, n * 5) : 0);
const TIERS = [[100, 1], [250, 2], [450, 3], [700, 4], [1000, 5]];
const kariFor = (sc) => TIERS.reduce((a, [p, k]) => (sc >= p ? k : a), 0);
const fatOf = (fish, slim) => Math.max(0, Math.min(MAXLV, Math.floor((fish - slim * 3) / 4)));
// ビッグより上は、ふえ方をゆるくして画面におさまるようにする
const radius = (lv) => 18 + Math.min(lv, 5) * 3 + Math.max(0, lv - 5) * 1.5;
const fatW = (lv) => 1 + Math.min(lv, 5) * 0.12 + Math.max(0, lv - 5) * 0.06;
const jumpT = (lv) => 0.26 + Math.min(lv, 5) * 0.045 + Math.max(0, lv - 5) * 0.02;
const CAT_COLORS = {
  kuro: { c0: '#3a2f5e', c1: '#0e0a1e', eye: '#7ff5d0', dark: 1, deep: '#6f61a6' }, shiro: { c0: '#ffffff', c1: '#d4d8f4', eye: '#7f96ff', deep: '#a9a9bf' },
  sakura: { c0: '#ffe6f4', c1: '#ffa6d4', eye: '#6a4bb8', deep: '#f07fb8' }, lav: { c0: '#f1e8ff', c1: '#b39bff', eye: '#4b3a8c', deep: '#8a72e0' },
  mint: { c0: '#e8fff7', c1: '#7fe3c4', eye: '#3e64a8', deep: '#45bf9c' }, sora: { c0: '#d9f4ff', c1: '#56bdf0', eye: '#3b3a8c', deep: '#2f92cf' },
  peach: { c0: '#fff1e8', c1: '#ffb596', eye: '#7a4aa0', deep: '#ee8456' }, lemon: { c0: '#fffbe2', c1: '#ffe07a', eye: '#8a5ad0', deep: '#f0b93a' },
  hoshi: { c0: '#5361d6', c1: '#1c2266', eye: '#ffe9a0', dark: 1, deep: '#8f9bf5' }, aurora: { c0: '#ffd6f0', c1: '#b8fbe9', eye: '#5b3fb8', deep: '#9a86f0' },
  budou: { c0: '#a27cf0', c1: '#4a2a9a', eye: '#ffd3f1', dark: 1, deep: '#d2b8ff' }, ichigo: { c0: '#ff9fcf', c1: '#e0468f', eye: '#fff3c4', dark: 1, deep: '#ffd0e6' },
};

      : { modal: '#F9F7FB', bg: '#F9F7FB', surface: '#EBE7F1', border: '#C4BBD3', ink: '#2B2640', sub: '#6E6684', soft: '#DCD4E8', accent: '#5B3F94', box: '#F3EDF8' };
    this.theme = { bg1: '#3E3170', bg2: '#A8779F', star: 'rgba(255,255,255,0.8)', trail: '#F6DDA2', lineBg: 'rgba(237,228,255,0.04)', wall: '#4B3B80', rope: '#5E4C96', ink: '#FFFFFF' };
    const S = this.state;
    return {
      nv: (() => { const go = (sc) => () => { try { window.sessionStorage.setItem('goScreen', sc); } catch (e) {} };
        return { ...(night ? { on: '#ECEBF0', bg: '#3A3448', off: '#C4BFCC', surface: '#26222F', line: '#353042' } : { on: '#5B3F94', bg: '#D8CCEE', off: '#4A4260', surface: '#EBE7F1', line: '#D4CDE0' }), none: 'transparent',
          shop: go('shop'), gacha: go('gacha'), game: go('gamepick'), music: go('music'), my: go('mypage') }; })(),
      t, embedded: !!this.props.embedded, standalone: !this.props.embedded, ovBottom: '92px', onHome: this.props.onHome, markPick: () => { try { window.sessionStorage.setItem('goPick', '1'); } catch (e) {} },
      kariLabel: S.kari.toLocaleString('ja-JP'), bumpAn: S.bump2 ? 'kari-bump 0.4s ease-out' : 'none', flyOn: !!S.fly,
      ...(() => {
        const plays = getPlays(GID), sub = isSub();
        const extra = plays >= PLAY_FREE, canAd = extra && getAdPlays(GID) < AD_PLAY_MAX;   // 広告なしプランも4回目からは同じ。動画のかわりにそのまま遊べる（1日3回まで）
        const idle = !S.paid && !S.over && !S.adOn;
        return {
          gateOn: idle, subOn: false, subTitle: '', gateNormal: !extra, gateExtra: extra, gateCanAd: canAd, gateAdBanner: canAd && !sub, adIcon: !sub, adLabel: sub ? 'はじめる' : '動画を見て遊ぶ',
          gateNo: S.kari < ENTRY, gateBg: S.kari < ENTRY ? t.sub : (t.accent === '#595266' ? '#8E6A9E' : t.accent),
          gateBtn: S.kari < ENTRY ? 'カリカリが足りないよ' : 'はじめる',
          payGate: () => { if (S.kari < ENTRY) return; this.payNow(ENTRY); },
          adNo: S.kari < ENTRY, adBg: S.kari < ENTRY ? t.sub : '#5B3F94', playAd: () => { if (S.kari < ENTRY || !canAd) return; if (sub) { addAdPlay(GID); this.payNow(ENTRY); } else this.startAd(); },
          payShort: S.kari < ENTRY_PAY, goCharge: () => { if (this.props.onCharge) this.props.onCharge(); }, markCharge: () => { try { window.sessionStorage.setItem('chargeFrom', 'CatClimb.dc.html'); } catch (e) {} },
          payNo: S.kari < ENTRY_PAY, payLine: S.kari < ENTRY_PAY ? t.border : '#A68BEA', payFg: S.kari < ENTRY_PAY ? t.sub : '#F3EEFF', playPay: () => { if (S.kari < ENTRY_PAY) return; this.payNow(ENTRY_PAY); },
        };
      })(),
      adOn: !!S.adOn, adLeft: S.adLeft || 0, adWait: !!S.adOn && S.adLeft > 0, adDone: !!S.adOn && !(S.adLeft > 0), adPct: `${Math.round((1 - (S.adLeft || 0) / AD_SEC) * 100)}%`,
      closeAd: () => this.finishAd(),
      soundOn: String(!S.mute), soundLabel: S.mute ? '音を出す' : '音を消す', soundPath: S.mute ? 'M16 9.5l5 5M21 9.5l-5 5' : 'M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11',
      toggleSound: () => { const m = !S.mute; this.mute = m; this.au.setMuted(m); if (m) this.au.stop(); else this.audio(); try { window.localStorage.setItem('miniMute', m ? '1' : '0'); } catch (e) {} this.setState({ mute: m }); },
      goPremium: () => { if (this.props.onPremium) this.props.onPremium(); }, markPremium: () => { try { window.sessionStorage.setItem('premiumFrom', 'CatClimb.dc.html'); } catch (e) {} },
      joinSub: () => { try { window.localStorage.setItem('premium', '1'); } catch (e) {} this.setState({ subTick: Date.now() }); },

      score: S.score.toLocaleString('ja-JP'), best: Math.max(S.best, S.score).toLocaleString('ja-JP'),
      tutOn: !!S.tutMsg, tutMsg: S.tutMsg || '', tutTap: S.tutTap || '', tutHasTap: !!S.tutTap, skipTut: () => { if (this.tut) this.tutEnd(); },
      tutAgain: () => { try { window.localStorage.removeItem('catClimbTut'); } catch (e) {} this.setState({ tutReset: true }); }, tutAgainLabel: S.tutReset ? 'つぎのスタートでチュートリアルがはじまるよ' : 'チュートリアルをもう一度やる',
      fatName: FATS[S.lv], fatStep: `${S.lv + 1}/${FATS.length}`,
      fatSegs: FATS.map((f, i) => ({ bg: i <= S.lv ? ['#ffb8ea', '#ffbdec', '#f5c2f2', '#e0c6fa', '#c9c8ff', '#b9cdff', '#b0dcfb', '#aae8f6', '#a7f3f2', '#a6fff0'][i] : 'rgba(255,255,255,0.2)' })),
      ...(() => { const m = S.maxLv || 0; return { topFatName: FATS[m], topFatStep: `${m + 1}/${FATS.length}`, topFatSegs:FATS.map((f, i) => ({ bg: i <= m ? ['#ffb8ea', '#ffbdec', '#f5c2f2', '#e0c6fa', '#c9c8ff', '#b9cdff', '#b0dcfb', '#aae8f6', '#a7f3f2', '#a6fff0'][i] : 'rgba(255,255,255,0.2)' })) }; })(),
      ready: S.ready,
      canvasRef: (el) => { this.cv = el; },
      tap: () => {
        if (S.over || S.help) return;
        if (!this.running && !this.dead) { this.audio(); this.running = true; if (!tutDone()) this.tut = { i: 0, s: 0 }; this.setState({ ready: false }); return; }
        if (this.tut) { const T = this.tut; if (!T.freeze) { if (T.free) this.jumpNow(); return; } T.freeze = false; this.setState({ tutTap: '' }); if (T.mode === 'jump') this.jumpNow(); else T.ok = true; return; }
        this.jumpNow();
      },
      pillZ: S.help ? 'auto' : 20,
      helpOn: S.help, openHelp: () => { if (this.props.onDim) this.props.onDim(true); this.au.stop(); this.setState({ help: true }); }, closeHelp: () => { if (this.props.onDim) this.props.onDim(false); this.last = performance.now(); setTimeout(() => this.audio(), 0); this.setState({ help: false }); },
      fats: FATS.map((f, i) => ({ label: `${i * 4}匹〜 ${f}` })),
      tiers: TIERS.map(([p, k], i) => ({ score: p.toLocaleString('ja-JP'), kari: k, line: i ? `1px solid ${t.bg}` : 'none' })), maxKari: TIERS[TIERS.length - 1][1],
      over: S.over, maxCombo: S.maxCombo || 0, overMsg: S.why, reward: S.reward, newBest: S.newBest, height: S.height, fish: S.fish,
      bigRef: (el) => { if (!el) return; const c = el.getContext('2d'); c.setTransform(SCALE, 0, 0, SCALE, 0, 0); c.clearRect(0, 0, 100, 90); c.save(); c.translate(50, 42); drawCat(c, 22, this.maxLv || 0, this.cat, 1, 0); c.restore(); },
      shareIg: () => this.shareRes('ig'), shareTw: () => this.shareRes('tw'), shareAny: () => this.shareRes('any'), shareDl: () => this.shareRes('dl'), resSaved: !!S.resSaved,
      restart: () => { this.reset(); this.setState({ misses: 0, combo: 0, tutMsg: '', tutTap: '', paid: false, score: 0, over: false, fly: false, reward: 0, newBest: false, lv: 0, ready: true }); }
    };
  }
}
